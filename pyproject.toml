[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cloud-data-warehouse-analytics"
version = "0.1.0"
description = "Weather analytics ELT: Open-Meteo -> BigQuery -> dbt"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "google-cloud-bigquery>=3.20,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
